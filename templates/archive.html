<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courtside · Archiv</title>
<link rel="icon" href="https://cdn.nba.com/logos/leagues/logo-nba.svg">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ base }}style.css">
<script>try{var t=localStorage.getItem('cs-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
<div class="wrap">
  <div class="hardwood"></div>
  <header class="masthead">
    <svg class="court" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMid slice" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><line x1="600" y1="0" x2="600" y2="260"/><circle cx="600" cy="130" r="90"/><circle cx="600" cy="130" r="30"/><rect x="0" y="70" width="190" height="120"/><circle cx="190" cy="130" r="60"/><path d="M0 10h70a230 230 0 0 1 0 240H0"/><rect x="1010" y="70" width="190" height="120"/><circle cx="1010" cy="130" r="60"/><path d="M1200 10h-70a230 230 0 0 0 0 240h70"/></svg>
    <div class="kicker">Das deutschsprachige NBA-Journal</div>
    <h1><a href="{{ base }}">C<span class="ball" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#e0662a" stroke="#1c1a16" stroke-width="5"/><path d="M50 4v92M4 50h92M20 15c20 16 20 54 0 70M80 15c-20 16-20 54 0 70" fill="none" stroke="#1c1a16" stroke-width="5"/></svg></span>URTSIDE</a></h1>
    <div class="sub">Archiv aller Ausgaben</div>
  </header>
  <ul class="arch">
    {% for i in issues %}
    <li>
      <div class="d">{{ i.weekday }}<br>{{ i.date_long }}<br>Nr. {{ i.issue_no }}</div>
      <div><h3><a href="{{ base }}ausgabe/{{ i.date }}/">{{ i.lead.title }}</a></h3><p>{{ i.lead.teaser }}</p></div>
    </li>
    {% endfor %}
  </ul>
  <footer><a href="{{ base }}">← Zur aktuellen Ausgabe</a></footer>
</div>
</body>
</html>
